{% extends "base.html" %}
{% block titre %}Mot de passe{% endblock %}
{% block contenu %}
<section class="bloc">
  <h1>Changer le mot de passe</h1>
  <p class="intro">Au moins 10 caractères. Ne le partagez pas.</p>
  <form method="post" action="/compte" class="panneau etroit">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Mot de passe actuel
      <input name="actuel" type="password" autocomplete="current-password" required maxlength="200">
    </label>
    <label>Nouveau mot de passe
      <input name="nouveau" type="password" autocomplete="new-password" required minlength="10" maxlength="200">
    </label>
    <label>Confirmer
      <input name="confirmation" type="password" autocomplete="new-password" required minlength="10" maxlength="200">
    </label>
    <button type="submit">Enregistrer</button>
  </form>
</section>
{% endblock %}
