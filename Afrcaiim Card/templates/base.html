<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block titre %}Cartes{% endblock %} — Université AFRICAIIM</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/static/polices.css">
  <link rel="stylesheet" href="/static/carte.css?v=21">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/mot-de-passe.js?v=1" defer></script>
  <script src="/static/impression-locale.js?v=1" defer></script>
  {% block tete %}{% endblock %}
</head>
<body>
  <header class="barre">
    <a class="marque" href="/">
      <img class="logo-barre" src="/static/marque.png" alt="Université AFRICAIIM">
    </a>
    {% include "nav.html" %}
  </header>
  <main>
    {% if user and user.doit_changer_mot_de_passe %}
      <p class="flash flash-avertissement">Ce mot de passe est temporaire. <a href="/compte">Changez-le maintenant</a>.</p>
    {% endif %}
    {% if flash %}
      <p class="flash flash-{{ flash.type }}">{{ flash.message }}</p>
    {% endif %}
    {% block contenu %}{% endblock %}
  </main>
</body>
</html>
