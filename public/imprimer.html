<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impression — Université AFRICAIIM</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; background: #eceff1; color: #0c3d2e; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .barre { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 18px; background: #fff; border-bottom: 3px solid #feab00; }
    .barre p { flex: 1 1 320px; margin: 0; }
    .barre button, .barre a { font: inherit; border-radius: 8px; padding: 8px 16px; text-decoration: none; cursor: pointer; }
    .barre button { background: #004c22; color: #fff; border: 0; font-weight: 600; }
    .barre button:disabled { opacity: .5; cursor: wait; }
    .barre a { color: #004c22; border: 1px solid #004c22; }
    .feuille { max-width: 820px; margin: 18px auto; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
    .feuille img { display: block; width: 100%; height: auto; }
    @media print {
      body { background: #fff; }
      .barre { display: none; }
      .feuille { max-width: none; margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
      .feuille:last-child { break-after: auto; page-break-after: auto; }
      .feuille img { max-height: 100vh; object-fit: contain; }
    }
  </style>
  <script type="module" src="/imprimer.js?v=1"></script>
</head>
<body>
  <header class="barre">
    <p id="etat">Préparation du document…</p>
    <button id="imprimer" type="button" disabled>Imprimer</button>
    <a id="pdf" href="#" target="_blank" rel="noopener">Ouvrir le PDF</a>
  </header>
  <main id="pages"></main>
</body>
</html>
