# Plateforme AfricaIIM : un serveur PostgreSQL commun, l'app Scolarité (Node.js) et les sauvegardes.
# Démarrage : docker compose up -d --build
name: africaiim

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: africaiim
      POSTGRES_USER: ${POSTGRES_USER:-africaiim_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
      SCOLARITE_DB_PASSWORD: ${SCOLARITE_DB_PASSWORD:?SCOLARITE_DB_PASSWORD manquant dans .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d africaiim"]
      interval: 5s
      timeout: 3s
      retries: 30

  scolarite:
    build: .
    image: africaiim-scolarite
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://scolarite:${SCOLARITE_DB_PASSWORD}@postgres:5432/africaiim
      CARD_API_URL: ${CARD_API_URL_DOCKER:-http://host.docker.internal:8000}
      UPLOAD_DIR: /app/data/uploads
      PORT: "4317"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-4317}:4317"
    volumes:
      - ./data/uploads:/app/data/uploads

  sauvegarde:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: africaiim
      PGUSER: ${POSTGRES_USER:-africaiim_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./data/backups:/backups
      - ./db/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  pg_data:
    name: africaiim_pg_data
